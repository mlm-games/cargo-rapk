name: Release crate (crates.io only)
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type (none/patch/minor/major)"
        required: false
        default: "patch"
        type: choice
        options:
          - none
          - patch
          - minor
          - major

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/crate-publish.yml@main
    with:
      bump-type: ${{ inputs.bump_type }}
      create-release: true
      workspace-publish: true
      workspace-exclude: "ndk-examples"
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}